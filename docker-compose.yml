version: '3.8'

services:
  alim:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alim4.0
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - PORT=${PORT:-3000}
    volumes:
      # Persist output data
      - ./output:/app/output
      # Persist scenarios (for custom scenarios)
      - ./scenarios:/app/scenarios
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - alim-network

networks:
  alim-network:
    driver: bridge
